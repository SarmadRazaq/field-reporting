# Fly.io config for the upload server. Deploy from server/: `fly deploy`.
# The app name must be unique on Fly; change it if it's taken.
app = "field-reports-server"
primary_region = "fra"

[build]

[env]
  PORT = "4000"
  DATA_DIR = "/data"

# SQLite and the uploaded photos live here; they survive deploys and restarts.
[mounts]
  source = "field_reports_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  # A redirect would turn the app's PUT/POST into a GET; both http and https work.
  force_https = false
  # Keep one machine up: chaos settings are in memory and uploads run for minutes.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# Thumbnails decode full camera photos; 256 MB is too tight for that.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
